<title>Leading People Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: program header with level tabs, then a module rail beside a reading column (rail collapses to chips on phones). Palette: navy, burnt orange and blue. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#0F2235; --muted:#4D5D71; --line:#D9E0EA;
  --accent:#B84A0E; --blue:#1F5FA8; --peach:#FCEBDD; --sky:#E3EDF8; --good:#2E7D4F; --goodbg:#E3F2E8; --warnbg:#FFF3E6;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C141E; --surface:#131E2C; --ink:#E7EDF5; --muted:#9DADC1; --line:#26364A;
  --accent:#F08A4B; --blue:#76A8EA; --peach:#33231A; --sky:#15273C; --good:#63C390; --goodbg:#16301F; --warnbg:#2E2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141E; --surface:#131E2C; --ink:#E7EDF5; --muted:#9DADC1; --line:#26364A;
  --accent:#F08A4B; --blue:#76A8EA; --peach:#33231A; --sky:#15273C; --good:#63C390; --goodbg:#16301F; --warnbg:#2E2216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--muted);margin-top:8px;max-width:58ch}
.status{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)}
.tracks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tracks button{border:0;background:none;padding:12px 14px 14px;cursor:pointer;text-align:left;border-bottom:3px solid transparent;margin-bottom:-1px;flex:0 0 auto}
.tracks button b{display:block;font-family:var(--f-display);font-size:1.02rem}
.tracks button small{color:var(--muted);font-size:.8rem}
.tracks button[aria-selected="true"]{border-bottom-color:var(--accent)}
.tracks button[aria-selected="true"] b{color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.rail button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rail button:hover{background:var(--sky)}
.rail button[aria-current="true"]{background:var(--sky)}
.rail button[aria-current="true"] .rt{color:var(--blue)}
.rail .rt{font-weight:600;font-size:.93rem;line-height:1.25}
.rail .rw{font-size:.76rem;color:var(--muted);grid-column:1}
.rail .ring{grid-row:1/3;grid-column:2;width:26px;height:26px}
.content{min-width:0}
.layout.solo{grid-template-columns:minmax(0,1fr)}

/* module */
.mhead{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.mhead h2{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:800}
.mhead h2 em{font-style:normal;color:var(--accent)}
.mhead .sub{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--blue)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;max-width:420px}
.bar span{display:block;height:100%;background:var(--good);transition:width .3s}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px}
.panel{border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.panel.peach{background:var(--peach)}
.panel.sky{background:var(--sky)}
.tag{align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--surface);padding:4px 10px;border-radius:6px}
.peach .tag{background:var(--accent)}
.sky .tag{background:var(--blue)}
.shift{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:1.02rem}
.shift dt{font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.shift dd{margin:0;font-weight:500}
.shift dd.to{font-weight:600}
section.blk{margin-bottom:38px}
section.blk>h3{font-size:1.45rem;font-weight:700;margin-bottom:6px}
section.blk>.lede{color:var(--muted);margin-bottom:16px;max-width:65ch}
.learn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{font-size:1.06rem;font-weight:700}
.card .src{font-size:.8rem;color:var(--muted);font-style:italic}
.card p{font-size:.95rem}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good);cursor:pointer}
.check.done{background:var(--goodbg);border-color:transparent}
.check.done span{color:var(--muted)}
.check small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.scn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.scn .setup{font-size:1.04rem;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 16px;text-align:left;cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--blue)}
.opt.picked.best{border-color:var(--good);background:var(--goodbg)}
.opt.picked.miss{border-color:var(--accent);background:var(--warnbg)}
.fb{border-left:3px solid var(--blue);padding:4px 0 4px 14px;font-size:.95rem;max-width:65ch}
.fb b{font-family:var(--f-display)}
.note{font-size:.88rem;color:var(--muted);max-width:65ch}
.ref{display:flex;flex-direction:column;gap:16px}
.ref label{font-weight:600;display:block;margin-bottom:6px;max-width:65ch}
textarea,input[type="text"],input[type="date"]{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
.checkin{background:var(--sky);border-radius:12px;padding:20px 24px}
.checkin ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--bg)}

/* overview */
.hero{display:flex;flex-direction:column;gap:14px;margin-bottom:32px}
.hero h2{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;max-width:18ch}
.hero h2 span{color:var(--accent)}
.hero p{max-width:62ch;font-size:1.06rem}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:36px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.step b{font-family:var(--f-display);display:block;margin-bottom:4px}
.step p{font-size:.9rem;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin-bottom:8px}
.tl-wk{font-size:.7rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tl-seg{border:0;border-radius:8px;padding:10px 8px;text-align:left;cursor:pointer;font-size:.8rem;font-weight:600;line-height:1.2;background:var(--sky);color:var(--ink);min-height:62px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tl-seg:hover{outline:2px solid var(--blue)}
.tl-seg.zero{background:var(--peach)}
.tl-seg.cap{background:var(--goodbg)}
.tl-seg small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-wrap{overflow-x:auto;margin-bottom:36px}
.tl-inner{min-width:640px}
.me{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.me label{font-size:.85rem;font-weight:600;display:flex;flex-direction:column;gap:6px}
.bigpct{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.bigpct svg{width:72px;height:72px;flex:0 0 auto}
.bigpct b{font-family:var(--f-display);font-size:1.3rem;display:block}

/* toolkit */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.tool>h3{font-size:1.3rem;margin-bottom:6px}
.tool>.lede{color:var(--muted);margin-bottom:16px;max-width:65ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 label{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.out{background:var(--sky);border-radius:10px;padding:16px 18px;margin-top:14px;white-space:pre-wrap;font-size:.95rem}
.qlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;max-width:68ch}
.brv{display:flex;flex-direction:column;gap:12px}
.brv-row{display:grid;grid-template-columns:150px minmax(0,1fr) 30px;gap:12px;align-items:center}
.brv-row b{font-family:var(--f-display)}
.brv-row small{display:block;color:var(--muted);font-size:.8rem;font-weight:400;font-family:var(--f-body)}
.brv-row input{width:100%;accent-color:var(--blue)}
.brv-row output{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.books div{padding-block:8px;border-bottom:1px solid var(--line)}
.books b{display:block}
.books span{font-size:.86rem;color:var(--muted)}

/* senior tracks */
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;padding-top:4px;border-top:1px solid var(--line);padding-block:16px 0}
.ladder span{font-size:.8rem;padding:6px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.ladder span.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.losses{display:flex;flex-direction:column;gap:14px}
.loss{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.loss h4{grid-column:1/-1;background:var(--surface);padding:14px 20px;font-size:1.15rem}
.loss h4 small{font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:4px}
.loss div{padding:14px 20px;font-size:.95rem}
.loss .c{background:var(--peach)}
.loss .t{background:var(--sky)}
.loss div b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.loss .c b{color:var(--accent)}
.loss .t b{color:var(--blue)}
.draft{display:inline-block;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--warnbg);color:var(--accent);margin-bottom:12px}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:20px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .rail .grp{display:none}
  .rail button{flex:0 0 auto;border:1px solid var(--line);grid-template-columns:auto auto}
  .rail .rw{display:none}
  .rail .ring{grid-row:1;width:20px;height:20px}
  .steps{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .pair,.learn,.grid2,.me,.books{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .loss{grid-template-columns:1fr}
  .brv-row{grid-template-columns:1fr 30px}
  .brv-row b{grid-column:1/-1}
  .panel,.scn,.tool,.checkin{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Leading People additions ---------- */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.say-l{font-weight:600;display:block;margin-bottom:6px}
.setup.step2{border-top:1px dashed var(--line);padding-top:14px;font-weight:500}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.opt.picked.good{border-color:var(--good);background:var(--goodbg)}
.opt.picked.mid{border-color:var(--blue);background:var(--sky)}
.opt.picked.bad{border-color:var(--accent);background:var(--warnbg)}
.rate{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:.78rem;padding:2px 8px;border-radius:5px;margin-right:6px;color:var(--surface)}
.rate.good{background:var(--good)} .rate.mid{background:var(--blue)} .rate.bad{background:var(--accent)}
.reply{background:var(--bg);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;max-width:65ch}
.reply p{font-style:italic}
.debrief{background:var(--sky);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.tag{color:var(--surface)}
.rpcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:12px;padding:20px 22px;box-shadow:inset 4px 0 0 var(--blue)}
.rpc-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.rpc-main h4{font-size:1.2rem}
.rpc-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.score{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.score b{font-family:var(--f-display);font-size:1.8rem;color:var(--good);font-variant-numeric:tabular-nums}
.score span{font-size:.72rem;color:var(--muted)}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.lab-head{display:flex;flex-direction:column;gap:6px}
.lab-head .tag{background:var(--accent)}
.lab-head h3{font-size:1.25rem}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.agenda li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:start}
.agenda li>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.min{font-size:.78rem;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.obs{margin:4px 0 0;padding-left:20px;font-size:.92rem}
.linkrow{text-align:left;width:100%;font:inherit;color:inherit;grid-template-columns:90px 1fr}
.linkrow:hover{border-color:var(--blue)}
.rp-picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.rp-picker button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-align:left;cursor:pointer}
.rp-picker button b{display:block;font-size:.9rem}
.rp-picker button small{color:var(--muted);font-size:.76rem}
.rp-picker button[aria-selected="true"]{border-color:var(--blue);background:var(--sky)}
.studio{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.brief h3{font-size:1.2rem}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.modes button[aria-checked="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface);font-weight:600}
.skills{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.chat{display:flex;flex-direction:column;gap:12px;min-width:0}
.warn{background:var(--warnbg);border-radius:10px;padding:12px 14px;font-size:.92rem}
.chat-log{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:260px;max-height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);margin:auto;text-align:center;max-width:40ch}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg span{font-size:.72rem;font-weight:600;color:var(--muted)}
.msg p{padding:10px 14px;border-radius:12px;white-space:pre-wrap}
.msg.me{align-self:flex-end;text-align:left}
.msg.me span{align-self:flex-end}
.msg.me p{background:var(--sky)}
.msg.them p{background:var(--peach)}
.typing{color:var(--muted);font-style:italic}
.composer{display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:76px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.feedback{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.fb-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.fb-head h3{font-size:1.15rem;margin-top:4px}
.fb-rows{display:flex;flex-direction:column;gap:10px}
.fb-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.fb-row p{font-size:.92rem}
.fb-row .tip{color:var(--blue)}
.dots{display:flex;gap:4px;padding-top:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--good)}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.stages{display:flex;flex-direction:column;gap:12px;position:relative}
.stage{display:grid;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}
.st-n{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--surface);background:var(--blue);border-radius:8px;padding:8px 10px;text-align:center}
.stage:first-child .st-n{background:var(--muted)}
.stage:nth-child(4) .st-n,.stage:nth-child(5) .st-n{background:var(--accent)}
.st-body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.st-body h4{font-size:1.12rem}
.st-body ul{margin:2px 0;padding-left:20px;font-size:.94rem}
.st-meta{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.escalate{background:var(--warnbg);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.escalate .tag{background:var(--accent)}
.escalate ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:30px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile span{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:.8rem}
.delta{align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--line);font-variant-numeric:tabular-nums}
.delta.up{background:var(--goodbg);color:var(--good)} .delta.down{background:var(--warnbg);color:var(--accent)}
.gtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

<script>
const FT_MODULES = [
{ id:"m0", weeks:"Week 0", wk:[0,0], short:"Before day one",
  eyebrow:"Before day one", title:"Start the new job <em>on purpose</em>", sub:"The first conversations set the terms",
  changes:"On Friday they were a peer. On Monday they are responsible for the team, and nobody has explained to the team how that works yet. Most new leaders let this moment happen to them. The first week sets expectations that are hard to undo later.",
  from:"I got the job.", to:"I have a new job, and I'm starting it deliberately.",
  learn:[
    {h:"A promotion is a role change, not a reward", src:"Linda Hill, Becoming a Manager",
     p:"Hill followed new managers through their first year. Most expected the job to be about authority and control. They found it was about trust, influence and depending on other people. The identity change took most of that first year."},
    {h:"Habits that made you successful can work against you", src:"Michael Watkins, The First 90 Days",
     p:"Watkins found that people in transition often fail by doubling down on what worked in the old role. He recommends agreeing on expectations with your own leader early and choosing a few early wins that build credibility."},
    {h:"Start with why you said yes", src:"Simon Sinek, Start With Why and Leaders Eat Last",
     p:"Sinek argues that people follow leaders who are clear about their purpose. He describes leadership as taking responsibility for the people in your care, not as a rank. Knowing why you took this role will carry you through the weeks it feels hard."}
  ],
  practice:[
    {id:"m0p1", t:"Meet with your leader and agree on three outcomes for your first 90 days.", s:"Write them down. You'll revisit them at your 90-day review."},
    {id:"m0p2", t:"Agree with your leader how and when the team hears about your promotion.", s:"Your leader should introduce the change. Don't announce yourself alone."},
    {id:"m0p3", t:"Write three sentences on why you said yes to this role.", s:"Use the reflection box below."},
    {id:"m0p4", t:"List former peers you're close to, and plan a reset conversation with each in your first week.", s:"Use the former-peer reset guide in the Toolkit."},
    {id:"m0p5", t:"Block 30 minutes a week on your calendar for this program for the next 12 weeks."}
  ],
  scenario:{ setup:"The day your promotion is announced, a former peer messages you: “Congrats!! Guess we can't complain about the metrics in the group chat anymore lol.”",
    options:[
      {t:"Reply “Ha, I'll pretend I didn't see that” and move on.", best:false, fb:"It feels friendly, but a joke now becomes the norm later. You've signaled that the venting can continue as long as you look away."},
      {t:"“Thank you! I'd really like to grab 20 minutes this week to talk about what changes and what stays the same.”", best:true, fb:"This keeps the warmth and names the change directly. It also puts the reset conversation on the calendar while it's easy, before a hard moment forces it."},
      {t:"Quietly leave the group chat without saying anything.", best:false, fb:"Leaving may be right eventually, but silence reads as distance or judgment. The team fills the gap with their own story about you."}
    ]},
  reflect:[
    {id:"m0r1", q:"Why did you say yes to this role? (Three sentences.)"},
    {id:"m0r2", q:"What did being great at your old job require? Which of those habits will help now, and which might get in the way?"},
    {id:"m0r3", q:"Ninety days from now, what do you want your team to say about working for you?"}
  ],
  checkin:["Your leader shares why they chose you, with specific strengths they've seen.","Your leader names one growth area openly, so there are no surprises later.","Agree on your weekly 1:1 time for the next 12 weeks.","Ask who your peer thought partner will be: another leader you can process hard moments with."]
},
{ id:"m1", weeks:"Weeks 1–2", wk:[1,2], short:"Lose “my way”",
  eyebrow:"What a promotion takes away · “my way”", title:"They lose <em>“my way”</em>", sub:"Connect first, then lead",
  changes:"Their way of working got them promoted. It was built for one person, and nobody on the team is that person. Feedback from someone who doesn't know you sounds like criticism. Feedback from someone who knows you sounds like help.",
  from:"Do it the way I did it.", to:"Know each person well enough to lead them.",
  learn:[
    {h:"Trust is built in small moments", src:"Brené Brown, Dare to Lead",
     p:"Brown breaks trust into seven parts she calls BRAVING: boundaries, reliability, accountability, vault (keeping confidences), integrity, non-judgment and generosity. She compares trust to marbles in a jar, added one small kept promise at a time."},
    {h:"People need to feel safe inside the team", src:"Simon Sinek, Leaders Eat Last",
     p:"Sinek's “Circle of Safety” idea is that when people don't have to protect themselves from their own leader, they put that energy into the work and into each other."},
    {h:"Care personally before you challenge directly", src:"Kim Scott, Radical Candor",
     p:"Scott's model pairs caring about the person with being willing to tell them the truth. Challenge without care feels harsh. Care without challenge leaves people without the information they need to grow."},
    {h:"Seek first to understand", src:"Stephen Covey, The 7 Habits of Highly Effective People",
     p:"Covey's fifth habit asks you to understand someone's situation before trying to be understood. For a new leader, this means listening before changing anything."}
  ],
  practice:[
    {id:"m1p1", t:"Hold a getting-to-know-you 1:1 with every person on your team.", s:"Questions are in the Toolkit. These are listening meetings, not status meetings."},
    {id:"m1p2", t:"Keep a private one-page note for each person.", s:"Their strengths, what they want to grow toward, what their work environment is like, and how they like to receive feedback."},
    {id:"m1p3", t:"Ask each person: what's one thing I did as a peer you'd like me to keep doing, and one you'd like me to stop?"},
    {id:"m1p4", t:"Do three small things you said you'd do, each within 48 hours.", s:"These are marbles in the jar."},
    {id:"m1p5", t:"Take the trust self-check in the Toolkit and note your lowest score."}
  ],
  scenario:{ setup:"One nurse on your team documents differently than you did. Her notes are slower and more thorough, and she finishes calls later in the day. Her metrics are met.",
    options:[
      {t:"Coach her to use your faster template so her day ends earlier.", best:false, fb:"This is “my way” in action. Her results are fine, so the change serves your preference, not her or the patients. She also learns that meeting the standard isn't enough with you."},
      {t:"Ask what works for her about her approach, and check whether the late-day calls create any risk for patients.", best:true, fb:"You learn something about her strengths and you check the one thing that matters: whether patients are affected. If there's no risk, her way is a valid way."},
      {t:"Say nothing. Her numbers are fine.", best:false, fb:"Not wrong, but it misses a chance to connect. Asking about someone's work, without trying to change it, is one of the easiest ways to build trust."}
    ]},
  reflect:[
    {id:"m1r1", q:"Whose working style is most different from yours? What might they be good at that you aren't?"},
    {id:"m1r2", q:"What surprised you most in your getting-to-know-you 1:1s?"}
  ],
  checkin:["Share two things you learned about your team that you didn't know as a peer.","Talk through your lowest trust self-check score and one way to build it.","Ask your leader how they learned to adapt their style to different people."]
},
{ id:"m2", weeks:"Weeks 3–4", wk:[3,4], short:"Lose the scoreboard",
  eyebrow:"What a promotion takes away · the scoreboard", title:"They lose <em>the scoreboard</em>", sub:"Build a new one",
  changes:"Their numbers used to tell them every day that they were good at the job. A leader's results show up weeks later, in other people's work. Without a new way to measure progress, most new leaders drift back to the work that still gives them a daily score.",
  from:"My numbers prove I'm good at my job.", to:"My team's growth is the proof.",
  learn:[
    {h:"Feeling less capable is normal", src:"Linda Hill, Becoming a Manager",
     p:"The new managers in Hill's research described feeling less competent for months. That wasn't a sign they were failing. It was the old identity letting go before the new one formed. Say this out loud on day one so it doesn't feel like a secret."},
    {h:"Lead measures and lag measures", src:"McChesney, Covey and Huling, The 4 Disciplines of Execution",
     p:"Lag measures tell you if you reached a goal, but only after the fact. Lead measures are the weekly actions you control that predict the goal. A leader's month-end metrics are lag. How the leader spends each week is lead."},
    {h:"What a leader's scoreboard tracks", src:"Program guidance",
     p:"How fast problems reach you. Whether each person's trend is improving. How many decisions the team made without you. Whether feedback happened within days of noticing something. Whether you kept your 1:1s."}
  ],
  practice:[
    {id:"m2p1", t:"Pick three lead measures from the list below and track them weekly.", s:"Your weekly scoreboard."},
    {id:"m2p2", t:"Each Friday, write down one thing a team member did better this week because of something you did."},
    {id:"m2p3", t:"Ask your leader how they'll judge your success at 30, 60 and 90 days."},
    {id:"m2p4", t:"Notice one moment you felt less capable. Write down what the job was actually asking of you then."}
  ],
  measures:true,
  scenario:{ setup:"End of week three. Your own patient panel numbers have dipped because you spent hours this week helping a nurse who was struggling. You feel behind.",
    options:[
      {t:"Stay late a few nights to get your own numbers back to where they used to be.", best:false, fb:"This pulls you back toward your old identity. Your old scoreboard is the one you know how to win, so it's tempting. It also teaches you that supporting people is the extra work, when it's now the main work."},
      {t:"Talk with your leader about panel expectations, and share what the support time produced.", best:true, fb:"This is the new scoreboard. Supporting a struggling nurse is leadership work. Your leader can help you balance it and should know where your time is going."},
      {t:"Cut back on 1:1s until your own numbers recover.", best:false, fb:"1:1s are usually the first thing to go and the most expensive to lose. Problems start reaching you later, which costs more time than it saves."}
    ]},
  reflect:[
    {id:"m2r1", q:"Where do you still look for daily proof that you're good at your job?"},
    {id:"m2r2", q:"What would count as a real win for you as a leader this week?"}
  ],
  checkin:["Review your three lead measures together. Are they the right ones?","Agree on what “good” looks like at 30, 60 and 90 days.","Talk about the moment you felt less capable, and what it taught you."]
},
{ id:"m3", weeks:"Weeks 5–6", wk:[5,6], short:"Lose the quick fix",
  eyebrow:"What a promotion takes away · the quick fix", title:"They lose <em>the quick fix</em>", sub:"Coach instead of rescue",
  changes:"For years, the answer to every problem was “I'll handle it.” It worked, and it's part of why they got promoted. Now every rescue teaches the team to wait for one, and the leader becomes the bottleneck.",
  from:"I'll handle it.", to:"What do you think we should do?",
  learn:[
    {h:"Accidental diminishers", src:"Liz Wiseman, Multipliers",
     p:"Wiseman describes well-meaning leaders who shrink their team's capability without realizing it. One type is the rescuer, who steps in the moment someone struggles. People stop building the muscle because the leader keeps lifting the weight."},
    {h:"Stay curious a little longer", src:"Michael Bungay Stanier, The Coaching Habit",
     p:"Bungay Stanier's advice is to slow the rush to give advice and ask one more question first. His favorite is three words: “And what else?” The first answer someone gives is rarely the whole picture."},
    {h:"Decide where decisions live", src:"Program guidance",
     p:"Agree with your team on three kinds of decisions: ones they make on their own, ones they make and tell you about after, and ones they bring to you first. Most rescuing happens because nobody has drawn these lines."}
  ],
  practice:[
    {id:"m3p1", t:"Keep a rescue log for one week.", s:"Each time you step in and fix something, note the question you could have asked instead."},
    {id:"m3p2", t:"Use a coaching question in five conversations.", s:"“What have you tried?” “What do you think the next step is?” “And what else?” “What do you need from me?”"},
    {id:"m3p3", t:"Agree with your team on which decisions are theirs, which they tell you about, and which they bring to you."},
    {id:"m3p4", t:"Hand off one task you've been doing for the team, with a clear outcome and a check-in date."}
  ],
  scenario:{ setup:"A nurse messages you: “Patient hasn't sent BP readings in five days. What do I do?” You know the answer right away. The patient isn't in danger.",
    options:[
      {t:"Tell her the steps. It's faster.", best:false, fb:"It's faster today. Next week she'll message you again, and so will everyone who watched it work. Speed now becomes your workload later."},
      {t:"“What have you tried so far, and what do you think the next step is?” Then confirm or add to her plan.", best:true, fb:"She does the thinking, you check it. Over time she'll skip the message and act on her own judgment, which is the goal."},
      {t:"Call the patient yourself so it's handled.", best:false, fb:"This is the classic rescue. The patient gets a call, but the nurse loses the chance to build the skill and learns that hard calls go up the chain."}
    ]},
  note:"Coaching is for growth moments. If a patient is at risk, act first and debrief afterward.",
  reflect:[
    {id:"m3r1", q:"What do you personally get out of being the person who fixes things?"},
    {id:"m3r2", q:"Looking at your rescue log, what does the team lose each time you step in?"}
  ],
  checkin:["Share your rescue log. Which entries surprised you?","Show your leader the decision lines you agreed on with your team.","Ask your leader where they still struggle not to rescue."]
},
{ id:"m4", weeks:"Weeks 7–8", wk:[7,8], short:"Lose the right to guess",
  eyebrow:"What a promotion takes away · the right to guess", title:"They lose <em>the right to guess</em>", sub:"Facts before stories",
  changes:"A peer can think “she just doesn't care” about a coworker who isn't performing, and it costs nothing. When a leader thinks it, it becomes a decision about someone's job. The story starts shaping every conversation that follows.",
  from:"She doesn't care.", to:"I see a missed number. I don't know why yet.",
  learn:[
    {h:"The Path to Action", src:"Patterson, Grenny, McMillan and Switzler, Crucial Conversations",
     p:"We see or hear something, tell ourselves a story about it, feel something because of the story, then act. Most of us skip straight from the facts to the story without noticing. The fix is to go back to what you actually saw."},
    {h:"Start with heart", src:"Crucial Conversations",
     p:"Before a hard conversation, ask what you really want: for yourself, for the other person, and for the relationship. If the honest answer is “to prove I'm right” or “to document this,” reset before you start."},
    {h:"State your path", src:"Crucial Conversations",
     p:"Share the facts first. Then share your interpretation as a possibility, not a conclusion. Ask for their view and mean it. The authors use the acronym STATE for this sequence."},
    {h:"Clear is kind, and prompt is kind", src:"Brené Brown, Dare to Lead",
     p:"Brown argues that avoiding a hard conversation feels kind but isn't. A short conversation within a few days is easier for everyone than a long one after months of frustration have built up."}
  ],
  practice:[
    {id:"m4p1", t:"Use the Conversation Planner in the Toolkit before your next performance conversation."},
    {id:"m4p2", t:"For one week, catch yourself telling a story about someone's motives. Write down only the facts."},
    {id:"m4p3", t:"Hold one check-in within 48 hours of noticing a missed standard."},
    {id:"m4p4", t:"After that conversation, compare what you assumed with what you learned."}
  ],
  scenario:{ setup:"The month-end report shows one nurse missed her monitoring-call target for the second month in a row. Your first thought: “She just doesn't care anymore.”",
    options:[
      {t:"Send an email restating the expectation and a deadline for improvement.", best:false, fb:"This acts on the story. If something real is in the way, like a scheduling conflict or a panel problem, the email won't fix it, and she'll feel judged without being heard."},
      {t:"Schedule a conversation this week, open with the numbers, and ask what's getting in the way.", best:true, fb:"Facts first, then curiosity. You'll either find a barrier you can help solve, or you'll have a clear, fair basis for next steps. Either way, it's prompt."},
      {t:"Give it one more month to see if it fixes itself.", best:false, fb:"Waiting makes the conversation harder and the pattern longer. It also tells the rest of the team that missing the standard twice has no effect."}
    ]},
  note:"In patient care, “non-adherent” often hides a barrier nobody has asked about. “Doesn't care” does the same thing to a nurse. Treat it as “barrier unknown” until you've asked.",
  reflect:[
    {id:"m4r1", q:"What's the most recent story you told yourself about someone on your team? What facts did you actually have?"},
    {id:"m4r2", q:"After your check-in conversation, what did you learn that you didn't expect?"}
  ],
  checkin:["Walk your leader through a filled-in Conversation Planner.","Debrief your 48-hour check-in: what went well, what you'd change.","Ask your leader about a time their story about someone turned out to be wrong."]
},
{ id:"m5", weeks:"Weeks 9–10", wk:[9,10], short:"Lose their peers",
  eyebrow:"What a promotion takes away · their peers", title:"They lose <em>their peers</em>", sub:"Hold the standard with people you like",
  changes:"They used to be part of the venting. Now the room goes quiet when they join, and a former peer's missed standard is theirs to address. If they skip that conversation, the rest of the team notices before the former peer does.",
  from:"One of us.", to:"Fair to all of us.",
  learn:[
    {h:"Make it safe: mutual purpose and respect", src:"Crucial Conversations",
     p:"People get defensive when they doubt your motive or feel disrespected. Before the hard part, make it clear you want something good for them, and that you still respect them."},
    {h:"Content, pattern, relationship", src:"Grenny, Patterson et al., Crucial Accountability",
     p:"The first time, talk about the specific miss. If it happens again, talk about the pattern. If it continues, talk about what it's doing to trust between you. Staying on the first-time conversation forever is how patterns grow."},
    {h:"Holding standards is fairness", src:"Patrick Lencioni, The Five Dysfunctions of a Team",
     p:"Lencioni names avoiding accountability as one of the ways teams break down. When a leader lets a friend slide, the people meeting the standard are the ones who pay for it."},
    {h:"Performance conversations are for success", src:"Program principle",
     p:"A performance conversation isn't a step in a paper trail toward letting someone go. Its purpose is to help the person succeed. When trust exists, people hear it that way."}
  ],
  practice:[
    {id:"m5p1", t:"If you haven't yet, hold the reset conversation with each former peer you were close to.", s:"Guide in the Toolkit."},
    {id:"m5p2", t:"Role-play your next hard conversation with your leader or thought partner before you have it."},
    {id:"m5p3", t:"Pick one person to process frustrations with: your leader or a peer leader. Stop venting to your team."},
    {id:"m5p4", t:"Hold one performance conversation during this program, then debrief it with your leader."}
  ],
  scenario:{ setup:"Your closest friend on the team has submitted documentation late three times this month. Others have noticed and are watching what you do.",
    options:[
      {t:"Bring it up casually during a personal chat so it doesn't feel like a big deal.", best:false, fb:"Mixing it into friendly conversation makes it easy to brush off, and it blurs what's personal and what's work. It can also feel like an ambush."},
      {t:"Ask for a private 1:1. Name the friendship, share the facts, ask what's happening, and agree on a plan.", best:true, fb:"Naming the friendship lowers the awkwardness instead of pretending it isn't there. You're treating them like every other team member, which is what the rest of the team needs to see."},
      {t:"Remind everyone about documentation deadlines at the team huddle.", best:false, fb:"Everyone who's on time feels scolded, the person it's about knows it was aimed at them, and the team sees you avoiding a direct conversation."}
    ]},
  reflect:[
    {id:"m5r1", q:"Who on your team would you most avoid giving feedback to? Why?"},
    {id:"m5r2", q:"What would it cost the rest of the team if you never had that conversation?"}
  ],
  checkin:["Role-play a hard conversation together. Switch roles once.","Debrief a performance conversation you held.","Talk about how your friendships on the team have changed, and what you miss."]
},
{ id:"m6", weeks:"Weeks 11–12", wk:[11,12], short:"What you earn",
  eyebrow:"What they can earn in return", title:"A team that tells them <em>the truth</em>", sub:"Authority comes with the title. Trust comes from what you do.",
  changes:"The title gives authority on day one. Trust comes from small things: connecting on a personal level, doing what you said you'd do, saying “I don't know,” and owning a miss out loud. People who feel safe with their leader bring problems early. That's how a leader finds out what is really going on.",
  from:"My title gives me authority.", to:"My actions give me trust.",
  learn:[
    {h:"Safe teams report more problems, not fewer", src:"Amy Edmondson, The Fearless Organization",
     p:"Studying hospital teams, Edmondson found that the better-led units reported more medication errors, not fewer. They weren't making more mistakes. People felt safe enough to say so. She calls this psychological safety."},
    {h:"Just culture", src:"Patient safety practice",
     p:"Healthcare safety work separates honest mistakes, at-risk choices and reckless behavior, and responds to each differently. Punishing honest mistakes guarantees you'll hear about fewer of them."},
    {h:"Leadership is a practice, not a rank", src:"Simon Sinek",
     p:"Sinek points out that holding a leadership title doesn't make someone a leader. The people who follow you decide that, based on how you treat them over time."}
  ],
  practice:[
    {id:"m6p1", t:"Run a short anonymous pulse with your team.", s:"Three questions: Can you bring problems to me early? Do I follow through on what I say? Do you know what good work looks like here?"},
    {id:"m6p2", t:"Own one miss out loud with your team."},
    {id:"m6p3", t:"Thank someone specifically for bringing you bad news early."},
    {id:"m6p4", t:"Write three leadership commitments: what your team can count on from you.", s:"Use the reflection box below."},
    {id:"m6p5", t:"Hold your 90-day review with your leader.", s:"Bring your first 90-day outcomes, your scoreboard, and your pulse results."}
  ],

function normalize(){
  const b = blankState();
  for(const k in b){ if(state[k]==null) state[k] = b[k]; }
  for(const k in b.growth){ if(state.growth[k]==null) state.growth[k] = b.growth[k]; }
  if(!state.shared.refl) state.shared.refl = {}; if(!state.shared.rp) state.shared.rp = {};
  for(const k in state.picks){ if(typeof state.picks[k] !== "object" || state.picks[k]===null) delete state.picks[k]; }
}
function loadLocal(){ try{ const s = localStorage.getItem(LS_KEY); if(s){ Object.assign(state, JSON.parse(s)); } }catch(e){} normalize(); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function setStatus(){
  const el = document.getElementById("status"); if(!el) return;
  el.className = "status" + (mode==="account" ? " ok" : "");
  el.querySelector("span").textContent = mode==="account" ? "Progress saves to your account" : "Progress saves on this device only";
}
function save(){ state.updatedAt = Date.now(); saveLocal(); if(!ref) return; clearTimeout(timer); timer = setTimeout(flush, 1200); }
async function flush(){
  if(!ref) return;
  if(writing){ pending = true; return; }
  writing = true;
  try{
    await ref.set(JSON.parse(JSON.stringify(state)));
    if(sumRef){ const sum = JSON.stringify(buildSummary()); if(sum!==lastSum){ try{ await sumRef.set(JSON.parse(sum)); lastSum = sum; }catch(e2){ if(e2 && e2.code==="invalid_argument") sumRef = null; } } }
  }
  catch(e){ if(e && (e.code==="invalid_argument" || e.code==="revoked" || e.code==="not_granted")){ ref=null; mode="device"; setStatus(); } }
  writing = false;
  if(pending){ pending=false; flush(); }
}
async function connect(){
  if(!window.claude || !window.claude.use){ samplerState = "none"; refreshStudio(); return; }
  window.claude.use("sample").then(s=>{ sampler = s; samplerState = s ? "ready" : "none"; refreshStudio(); }).catch(()=>{ samplerState="none"; refreshStudio(); });
  try{
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const r = db.doc("data/users/" + uid + "/progress");
    sumRef = db.doc("progress/" + uid); userNs = user;
    try{ isOwner = !!(await user.isOwner()); }catch(e){ isOwner = false; }
    if(isOwner) watchCohort(db);
    const snap = await r.get();
    if(snap.exists){
      const d = snap.data();
      if((d.updatedAt||0) > (state.updatedAt||0)){ state = Object.assign(blankState(), JSON.parse(JSON.stringify(d))); normalize(); saveLocal(); }
    }
    ref = r; mode = "account"; setStatus(); if(!rpBusy) render();
    if(state.updatedAt) flush();
  }catch(e){}
}

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function modProgress(m){
  let done = 0, total = m.practice.length + m.reflect.length + 1 + (m.roleplay?1:0);
  m.practice.forEach(p=>{ if(state.checks[p.id]) done++; });
  m.reflect.forEach(r=>{ if((state.notes[r.id]||"").trim()) done++; });
  const pk = state.picks[m.id]; if(pk && pk.s1!=null) done++;
  if(m.roleplay && state.rp[m.roleplay.id] && state.rp[m.roleplay.id].fb) done++;
  return {done, total, pct: Math.round(done/total*100)};
}
function overall(){ let d=0,t=0; MODULES.forEach(m=>{ const p=modProgress(m); d+=p.done; t+=p.total; }); return Math.round(d/t*100); }
function ring(pct){
  const r = 15.5, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--good)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/></svg>`;
}

function renderScenario(m){
  const scn = m.scenario, pk = state.picks[m.id] || {};
  let html = `<p class="setup">${scn.setup}</p>
    <div><label for="say-${m.id}" class="say-l">${scn.ask}</label><textarea id="say-${m.id}" data-say="${m.id}" placeholder="Type it the way you'd actually say it.">${esc(pk.say)}</textarea></div>`;
  if(!pk.open){ return html + `<div><button class="btn" data-reveal="${m.id}">Show the options →</button></div>`; }
  scn.steps.forEach((st,si)=>{
    if(si>0 && pk["s"+(si-1)]==null) return;
    const chosen = pk["s"+si];
    if(st.setup) html += `<p class="setup step2">${st.setup}</p>`;
    html += `<div class="opts">${st.options.map((o,k)=>{
      const cls = chosen===k ? "picked "+RATING[o.r][1] : (chosen!=null ? "dim" : "");
      return `<button class="opt ${cls}" data-pick="${m.id}" data-step="${si}" data-k="${k}" ${chosen!=null?"disabled":""}>${o.t}</button>`;
    }).join("")}</div>`;
    if(chosen!=null){
      const o = st.options[chosen];
      html += `<div class="fb"><span class="rate ${RATING[o.r][1]}">${RATING[o.r][0]}</span> ${o.fb}</div>`;
      if(o.reply) html += `<div class="reply"><span class="eyebrow">What happens</span><p>${o.reply}</p></div>`;
      if(o.r!=="strong"){ const best = st.options.find(x=>x.r==="strong"); html += `<p class="note"><b>A stronger move:</b> ${best.t}</p>`; }
    }
  });
  if(pk.s1!=null){
    html += `<div class="debrief"><span class="tag">What strong leaders do here</span><p>${scn.debrief}</p></div>`;
    if((pk.say||"").trim()) html += `<p class="note">Compare it with what you wrote at the start. What would you change?</p>`;
    html += `<div><button class="btn" data-reset="${m.id}">Try the scenario again</button></div>`;
  }
  if(scn.note) html += `<p class="note">${scn.note}</p>`;
  return html;
}

      <p class="note">${MODES[st.mode]}</p>

function renderFeedback(rp, fb){
  const avg = rpAvg(fb);
  return `<div class="feedback" id="rp-fb"><div class="fb-head"><div><span class="eyebrow">Your feedback</span><h3>${esc(fb.overall||"")}</h3></div><div class="score"><b>${avg!=null?avg:"–"}</b><span>average of 3</span></div></div>
    <div class="fb-rows">${(fb.scores||[]).map(s=>`<div class="fb-row"><div class="dots" aria-label="${Number(s.score)} of 3">${[1,2,3].map(n=>`<i class="${n<=Number(s.score)?"on":""}"></i>`).join("")}</div><div><b>${esc(s.skill)}</b><p>${esc(s.evidence)}</p>${s.tip?`<p class="tip">${esc(s.tip)}</p>`:""}</div></div>`).join("")}</div>
    ${fb.strongest?`<p><b>Your strongest moment:</b> ${esc(fb.strongest)}</p>`:""}

    <p class="note">Try it again on a harder setting, or bring this feedback to your 1:1.</p></div>`;

function rules(rp, mode){
  return `You are playing a role in a leadership training exercise at a nurse-led remote patient monitoring company. The user is a newly promoted nurse leader practicing a real workplace conversation with a nurse on their team. Stay fully in character as ${rp.who} (${rp.role}) for the whole conversation.

Situation from the leader's side: ${rp.brief}

Who ${rp.who} is: ${rp.persona}

Hidden context, known only to ${rp.who}: ${rp.hidden} Reveal it gradually and only when the leader earns it by asking open questions, listening, and not judging. Never volunteer all of it at once.

Difficulty: ${MODES[mode]}

How to reply: write only ${rp.who}'s spoken words, as in a real video call. One to four sentences. Natural, everyday speech. React honestly to what the leader actually says: if they judge, lecture or assume, become more guarded; if they listen and show care, open up. Do not coach the leader, give feedback, summarize, or step out of character. Do not use real patient names. If the leader writes something clearly inappropriate, respond as a real nurse would.`;
}
function rpMessages(rp, st){
  let turns = st.turns.slice(-30);
  while(turns.length && turns[0].role!=="leader") turns = turns.slice(1);
  const msgs = turns.map(t=>({role: t.role==="leader"?"user":"assistant", content: t.text}));
  if(msgs.length) msgs[0] = {role:"user", content: rules(rp, st.mode) + "\n\nThe leader's opening message to " + rp.who + ":\n" + msgs[0].content};
  return msgs;
}
function sampleErr(e){
  const c = e && e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ samplerState = "none"; return "The practice partner isn't available for your account here."; }
  if(c==="rate_limited") return "Too many practice messages at once. Wait a minute and try again.";
  if(c==="session_expired") return "Sign in to Claude again, then retry.";
  if(c==="refused") return "Claude couldn't continue with that message. Try rephrasing it.";
  if(c==="cancelled") return "Stopped.";
  if(c==="invalid_json") return "The feedback didn't come back in a readable form. Try again.";
  return "Something interrupted the reply. Try sending again.";
}
async function rpSend(){
  const input = document.getElementById("rp-input"), text = (input.value||"").trim();
  if(!text || rpBusy || !sampler) return;
  const rp = ROLEPLAYS.find(r=>r.id===state.rpSel), st = rpState(rp.id);
  st.turns.push({role:"leader", text}); st.fb = null; save();
  rpBusy = true; render();
  const log = document.getElementById("chat-log");
  const bub = document.createElement("div"); bub.className = "msg them"; bub.innerHTML = `<span>${esc(rp.who)}</span><p class="typing">${esc(rp.who)} is typing…</p>`;
  log.appendChild(bub); log.scrollTop = log.scrollHeight;
  const p = bub.querySelector("p");
  rpCtl = new AbortController();
  let msg = "";
  try{
    const res = await sampler(rpMessages(rp, st), {cache:false, modelTier:"quick", signal:rpCtl.signal, onText:({text})=>{ p.classList.remove("typing"); p.textContent = text; log.scrollTop = log.scrollHeight; }});
    st.turns.push({role:"them", text: res.text.trim()});
  }catch(e){
    if(e && e.text){ st.turns.push({role:"them", text:e.text.trim()}); }
    msg = sampleErr(e);
  }
  rpBusy = false; rpCtl = null; save(); render();
  const box = document.getElementById("rp-input"); if(box) box.focus();
  if(msg){ const el=document.getElementById("rp-msg"); if(el) el.textContent = msg; }
}
async function rpFeedback(){
  if(rpBusy || !sampler) return;
  const rp = ROLEPLAYS.find(r=>r.id===state.rpSel), st = rpState(rp.id);
  const transcript = st.turns.map(t=>(t.role==="leader"?"LEADER: ":rp.who.toUpperCase()+": ")+t.text).join("\n");
  const prompt = `You are an expert leadership coach for new nurse leaders. Your coaching draws on Crucial Conversations, Brené Brown's Dare to Lead, Kim Scott's Radical Candor and Michael Bungay Stanier's The Coaching Habit. Evaluate ONLY the leader's side of this practice conversation. Be specific, warm and honest. Quote or closely reference what the leader actually said.

Scenario: ${rp.brief}
Leader's goal: ${rp.goal}
What the nurse was privately holding back: ${rp.hidden}
Difficulty setting: ${st.mode}

Skills to score, each from 1 to 3 (1 = not yet, 2 = partly, 3 = strong):
${rp.skills.map((s,i)=>(i+1)+". "+s).join("\n")}

Transcript:
${transcript}

Reply with only a JSON object in exactly this shape:
{"overall":"one encouraging, honest sentence summarizing how it went","scores":[{"skill":"exact skill name","score":2,"evidence":"what the leader said or did that shows this","tip":"one specific thing to do differently"}],"strongest":"the leader's best moment, quoted","try_this":"a better line the leader could have said at a specific moment, written as a quote","hidden":"one sentence on whether the leader uncovered what the nurse was holding back, and why or why not","next":"one thing to practice next time"}
Include one entry in "scores" for every skill above, in the same order.`;
  rpBusy = true; render();
  const el = document.getElementById("rp-msg"); if(el) el.textContent = "Reviewing your conversation. This can take up to a minute…";
  rpCtl = new AbortController();
  let msg = "";
  try{
    const fb = await sampler.json(prompt, {cache:false, signal:rpCtl.signal});
    if(!fb || !Array.isArray(fb.scores)) throw {code:"invalid_json"};
    fb.scores = fb.scores.map(s=>({skill:String(s.skill||""), score:Math.max(1,Math.min(3,Number(s.score)||1)), evidence:String(s.evidence||""), tip:String(s.tip||"")}));
    st.fb = fb;
    st.history = (st.history||[]).concat([{d:new Date().toISOString().slice(0,10), avg:rpAvg(fb), mode:st.mode}]).slice(-12);
  }catch(e){ msg = sampleErr(e); }
  rpBusy = false; rpCtl = null; save(); render();
  if(msg){ const m2=document.getElementById("rp-msg"); if(m2) m2.textContent = msg; }
  else { const f=document.getElementById("rp-fb"); if(f) f.scrollIntoView({behavior:"smooth", block:"start"}); }
}

/* ---------------- GROWTH ---------------- */
function avgOf(obj, n){ const v=[]; for(let i=0;i<n;i++){ const x=Number(obj[i]); if(x) v.push(x); } return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; }
function deltaChip(a,b){ if(a==null||b==null) return ""; const d=Math.round((b-a)*10)/10; return `<span class="delta ${d>0?"up":(d<0?"down":"")}">${d>0?"+":""}${d}</span>`; }
function barPair(a,b,max){ const w=x=>x?Math.round(x/max*100):0; return `<div class="bars"><div class="b0" style="width:${w(a)}%"></div><div class="b1" style="width:${w(b)}%"></div></div>`; }
function renderGrowth(){
  const g = state.growth;
  const s0 = avgOf(g.self0, SELF_SKILLS.length), s1 = avgOf(g.self12, SELF_SKILLS.length);

  const num = (grp,i,val)=>`<input type="text" inputmode="decimal" id="${grp}-${i}" data-grow="${grp}" data-i="${i}" value="${esc(val)}" placeholder="1.0–5.0" aria-label="${grp==="pulse0"?"Week 0":"Week 12"} average">`;
  return `
  <div class="mhead"><div class="eyebrow">Start here</div><h2>My <em>growth</em></h2><div class="sub">Measure where you start, and see how far you've come</div></div>
  <div class="tiles">
    <div class="tile"><span>Self-assessment</span><b>${s0??"–"} → ${s1??"–"}</b>${deltaChip(s0,s1)}<small>Average of 5, Week 0 to Week 12</small></div>
    <div class="tile"><span>Team pulse</span><b>${p0??"–"} → ${p1??"–"}</b>${deltaChip(p0,p1)}<small>Average of 5, from your team</small></div>
    <div class="tile"><span>Practice conversations</span><b>${rpRuns}</b><small>Scored sessions in the studio</small></div>
  </div>
  <section class="blk"><h3>Self-assessment</h3><p class="lede">Rate yourself from 1 (not yet) to 5 (consistently) in Week 0, and again in Week 12 without looking back first. Most new leaders rate themselves lower on a few skills at Week 12. That usually means they understand the skill better, not that they've gotten worse.</p>
    <div class="gtable"><div class="gh"><span>Skill</span><span>Week 0</span><span>Week 12</span><span></span></div>
    ${SELF_SKILLS.map((s,i)=>`<div class="gr"><span>${s}</span>${sel("self0",i,g.self0[i])}${sel("self12",i,g.self12[i])}<div>${barPair(Number(g.self0[i])||0, Number(g.self12[i])||0, 5)}</div></div>`).join("")}
    </div></section>
  <section class="blk"><h3>Team pulse</h3><p class="lede">An anonymous survey your team completes in Week 0 and Week 12. Ask your leader to send it and share the averages with you, so responses stay anonymous. Wait for at least four responses before looking at results.</p>
    <div class="tool"><h3>The survey</h3><p class="lede">Ten statements rated 1 (strongly disagree) to 5 (strongly agree), plus two open questions. Copy it into an anonymous survey tool.</p>
      <ol class="qlist">${PULSE_Q.map(q=>`<li>${q}</li>`).join("")}${PULSE_OPEN.map(q=>`<li>${q} <i>(open answer)</i></li>`).join("")}</ol>
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" data-copy="pulse">Copy the survey</button><span class="note" id="copy-pulse" role="status"></span></div>
      <pre class="sr" id="out-pulse">${esc("Team pulse (anonymous)\nRate each from 1 (strongly disagree) to 5 (strongly agree).\n\n"+PULSE_Q.map((q,i)=>(i+1)+". "+q).join("\n")+"\n\nOpen questions:\n"+PULSE_OPEN.map(q=>"- "+q).join("\n"))}</pre>
    </div>
    <div class="gtable"><div class="gh"><span>Statement</span><span>Week 0</span><span>Week 12</span><span></span></div>
    ${PULSE_Q.map((q,i)=>`<div class="gr"><span>${q}</span>${num("pulse0",i,g.pulse0[i])}${num("pulse12",i,g.pulse12[i])}<div>${barPair(Number(g.pulse0[i])||0, Number(g.pulse12[i])||0, 5)}</div></div>`).join("")}
    <div class="gr"><span><b>Number of responses</b></span><input type="text" inputmode="numeric" id="n0" data-grown="n0" value="${esc(g.n0)}" aria-label="Week 0 responses"><input type="text" inputmode="numeric" id="n12" data-grown="n12" value="${esc(g.n12)}" aria-label="Week 12 responses"><div></div></div>

    <div class="legend"><span><i class="b0"></i>Week 0</span><span><i class="b1"></i>Week 12</span></div></section>

    <div class="checks">${ROLEPLAYS.map(r=>{ const h=(state.rp[r.id]&&state.rp[r.id].history)||[]; return `<button class="check linkrow" data-rp="${r.id}"><span class="min">${h.length?h[h.length-1].avg+"/3":"–"}</span><span><b>${r.title}</b><small>${h.length?h.map(x=>x.avg+" ("+x.mode+")").join(" → "):"Not practiced yet"}</small></span></button>`; }).join("")}</div></section>`;

/* ---------------- TOOLKIT + SPONSOR ---------------- */
function plannerText(tool){
  let out = tool.template;
  tool.fields.forEach(f=>{ const v = (state.planner[(tool.prefix||"")+f.key]||"").trim(); out = out.split("{"+f.key+"}").join(v || "["+f.blank+"]"); });
  return out;
}
function renderPlanner(t){
  const pre = t.prefix||"";
  return `<div class="tool" id="tool-${t.id}"><h3>${t.title}</h3><p class="lede">${t.lede}</p>
    <div class="grid2">${t.fields.map(f=>`<label for="pl-${pre}${f.key}">${f.label}${f.input?`<input type="text" id="pl-${pre}${f.key}" data-plan="${pre}${f.key}" data-tool="${t.id}" value="${esc(state.planner[pre+f.key])}" placeholder="${esc(f.ph||"")}">`:`<textarea id="pl-${pre}${f.key}" data-plan="${pre}${f.key}" data-tool="${t.id}" placeholder="${esc(f.ph||"")}">${esc(state.planner[pre+f.key])}</textarea>`}</label>`).join("")}</div>
    ${t.note?`<p class="note" style="margin-top:12px">${t.note}</p>`:""}

}
function braveFocus(){ const s = BRAVING.map(x=>({n:x[0], v:Number(state.braving[x[0]]||3)})); return s.reduce((a,c)=>c.v<a.v?c:a, s[0]).n; }
function renderTool(t){
  if(t.type==="planner") return renderPlanner(t);

function renderToolkit(){
  return `<div class="mhead"><div class="eyebrow">Resources</div><h2>The <em>toolkit</em></h2><div class="sub">Use these alongside the modules, and keep using them after.</div></div>

  <div class="tool"><h3>Further reading</h3><div class="books">${P.books.map(b=>`<div><b>${b[0]}</b><span>${b[1]}</span></div>`).join("")}</div></div>`;
}
function renderSponsor(){

/* ---------------- EVENTS ---------------- */
function go(sec){
  if(rpBusy && rpCtl) rpCtl.abort();
  view.sec = sec; render();
  try{ history.replaceState(null,"","#"+sec); }catch(e){}
  try{ sessionStorage.setItem(LS_KEY+"-view", sec); }catch(e){}
  document.getElementById("ladder").scrollIntoView({behavior:"smooth", block:"start"});
}
function copyOut(id){
  const el = document.getElementById("out-"+id), msg = document.getElementById("copy-"+id);
  const txt = el ? el.textContent : "";
  const fallback = ()=>{ if(!el) return; el.classList.remove("sr"); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); if(msg) msg.textContent="Selected. Press Ctrl+C or Cmd+C to copy."; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ if(msg) msg.textContent="Copied."; }, fallback); }catch(e){ fallback(); }
}
function rerenderScenario(id){ const m = MODULES.find(x=>x.id===id); const box = document.getElementById("scn-"+id); if(m && box) box.innerHTML = renderScenario(m); renderRail(); }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-sec],[data-pick],[data-reveal],[data-reset],[data-rp],[data-rpsel],[data-mode],[data-copy],[data-share],[data-unshare],[data-rpshare],[data-rpunshare],[data-leader],#rp-send,#rp-end,#rp-reset,#rp-stop");
  if(!t) return;
  if(t.dataset.sec){ go(t.dataset.sec); return; }
  if(t.dataset.reveal){ const id=t.dataset.reveal; state.picks[id] = Object.assign(state.picks[id]||{}, {open:true}); save(); rerenderScenario(id); return; }
  if(t.dataset.pick){ const id=t.dataset.pick; const pk = state.picks[id] = state.picks[id]||{open:true}; pk["s"+t.dataset.step] = Number(t.dataset.k); save(); rerenderScenario(id); return; }
  if(t.dataset.reset){ const id=t.dataset.reset; state.picks[id] = {say: (state.picks[id]||{}).say, open:true}; save(); rerenderScenario(id); return; }
  if(t.dataset.rp){ state.rpSel = t.dataset.rp; save(); go("studio"); return; }
  if(t.dataset.rpsel){ if(rpBusy) return; state.rpSel = t.dataset.rpsel; save(); render(); return; }
  if(t.dataset.mode){ if(rpBusy) return; rpState(state.rpSel).mode = t.dataset.mode; save(); render(); return; }
  if(t.dataset.copy){ copyOut(t.dataset.copy); return; }
  if(t.dataset.share){ const id=t.dataset.share; const txt=(state.notes[id]||"").trim(); if(!txt) return; state.shared.refl[id] = {text:txt, at:new Date().toISOString().slice(0,10)}; save(); document.getElementById("sb-"+id).innerHTML = shareBar(id); return; }
  if(t.dataset.unshare){ const id=t.dataset.unshare; delete state.shared.refl[id]; save(); document.getElementById("sb-"+id).innerHTML = shareBar(id); return; }
  if(t.dataset.rpshare){ const st=rpState(t.dataset.rpshare); state.shared.rp[t.dataset.rpshare] = {turns: st.turns.slice(-30), at:new Date().toISOString().slice(0,10)}; save(); render(); return; }
  if(t.dataset.rpunshare){ delete state.shared.rp[t.dataset.rpunshare]; save(); render(); return; }
  if(t.dataset.leader){ dashSel = t.dataset.leader; render(); const d=document.getElementById("dash-detail"); if(d) d.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(t.id==="rp-send"){ rpSend(); return; }
  if(t.id==="rp-end"){ rpFeedback(); return; }
  if(t.id==="rp-stop"){ if(rpCtl) rpCtl.abort(); return; }
  if(t.id==="rp-reset"){ const st = rpState(state.rpSel); st.turns = []; st.fb = null; save(); render(); return; }
});
document.addEventListener("keydown", e=>{ if(e.target.id==="rp-input" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); rpSend(); } });
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.check){
    state.checks[t.dataset.check] = t.checked; t.closest(".check").classList.toggle("done", t.checked); save(); renderRail();
    const m = MODULES.find(x=>x.id===view.sec); if(m){ const bar=document.querySelector(".bar span"); if(bar) bar.style.width = modProgress(m).pct+"%"; }
  } else if(t.dataset.grow && t.tagName==="SELECT"){ state.growth[t.dataset.grow][t.dataset.i] = t.value; save(); render(); }
  else if(t.dataset.grow || t.dataset.grown){ render(); }
  else if(t.id==="coh-filter"){ dashCohort = t.value; dashSel = null; render(); }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.note){ state.notes[t.dataset.note] = t.value; save(); const sb=document.getElementById("sb-"+t.dataset.note); if(sb && !sb.dataset.lock){ sb.innerHTML = shareBar(t.dataset.note); } }
  else if(t.dataset.say){ const pk = state.picks[t.dataset.say] = state.picks[t.dataset.say]||{}; pk.say = t.value; save(); }
  else if(t.dataset.me){ state.me[t.dataset.me] = t.value; save(); }
  else if(t.dataset.plan){ state.planner[t.dataset.plan] = t.value; const tool = t.dataset.tool==="doc" ? P.docTool : P.tools.find(x=>x.id===t.dataset.tool); const out=document.getElementById("out-"+t.dataset.tool); if(tool && out) out.textContent = plannerText(tool); save(); }
  else if(t.dataset.grow && t.tagName==="INPUT"){ const v = t.value.trim(); const n = Number(v); state.growth[t.dataset.grow][t.dataset.i] = (v && n>=1 && n<=5) ? v : (v ? state.growth[t.dataset.grow][t.dataset.i]||"" : ""); save(); }
  else if(t.dataset.grown){ state.growth[t.dataset.grown] = t.value.replace(/[^0-9]/g,""); save(); }
  else if(t.dataset.brv){
    state.braving[t.dataset.brv] = Number(t.value); document.getElementById("out-"+t.dataset.brv).textContent = t.value;
    document.getElementById("brv-focus").innerHTML = `Your focus area: <b>${braveFocus()}</b>. Pick one small action this week that builds it.`; save();
  }
});
document.addEventListener("focusout", e=>{ if(e.target.matches("textarea,input[type=text]") && !rpBusy && view.sec!=="growth") renderRail(); });

function shareBar(id){
  const sh = state.shared.refl[id], txt = (state.notes[id]||"").trim();
  if(sh){
    const stale = txt && txt !== sh.text;
    return `<span class="shared-on">Shared with your program leader on ${esc(sh.at)}.${stale?" You've edited it since.":""}</span>${stale?` <button class="btn ghost" data-share="${id}">Update shared copy</button>`:""} <button class="btn ghost" data-unshare="${id}">Stop sharing</button>`;
  }
  return `<button class="btn ghost" data-share="${id}" ${txt?"":"disabled"}>Share with my program leader</button>`;
}
function buildSummary(){
  const scen = {}, rp = {};
  MODULES.forEach(m=>{
    const pk = state.picks[m.id]; if(!pk) return;
    const o0 = pk.s0!=null ? m.scenario.steps[0].options[pk.s0] : null, o1 = pk.s1!=null ? m.scenario.steps[1].options[pk.s1] : null;
    scen[m.id] = {say:(pk.say||"").slice(0,1500), s0:pk.s0??null, s1:pk.s1??null, r0:o0?o0.r:null, r1:o1?o1.r:null};
  });
  ROLEPLAYS.forEach(r=>{
    const st = state.rp[r.id]; if(!st || (!st.fb && !(st.history||[]).length)) return;

  });
  return {name:state.me.name||"", cohort:state.me.cohort||"", updatedAt:state.updatedAt||0, overall:overall(),
    modules:MODULES.map(m=>({id:m.id, pct:modProgress(m).pct})), scen, rp,
    growth:JSON.parse(JSON.stringify(state.growth)), shared:JSON.parse(JSON.stringify(state.shared))};
}
function watchCohort(db){
  try{
    db.collection("progress").onSnapshot(async snap=>{
      cohortDocs = snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id}, d.data()));
      try{ if(userNs && userNs.profiles){ const ps = await userNs.profiles(cohortDocs.map(d=>d.id)); cohortNames = {}; cohortDocs.forEach(d=>{ cohortNames[d.id] = (ps && ps[d.id] && ps[d.id].name) || ""; }); } }catch(e){}
      renderRail();
      if(view.sec==="dashboard" && !rpBusy) render();
    }, ()=>{});
  }catch(e){}
}
const leaderName = d => (d.name||"").trim() || cohortNames[d.id] || "Unnamed leader";
const ago = ts => { if(!ts) return "–"; const days = Math.floor((Date.now()-ts)/86400000); return days<=0 ? "Today" : days===1 ? "Yesterday" : days+" days ago"; };
const dAvg = d => { const v=[]; Object.values(d.rp||{}).forEach(x=>{ const a=x.fb?rpAvg(x.fb):null; if(a!=null) v.push(a); }); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; };
const gAvg = (obj,n) => avgOf(obj||{}, n);
function currentModule(d){ const m = (d.modules||[]).find(x=>x.pct<100); return m ? (MODULES.find(x=>x.id===m.id)||{}).short : "All modules done"; }
function renderDashboard(){

  const selfD = avg(docs.map(d=>{ const a=gAvg(d.growth&&d.growth.self0,SELF_SKILLS.length), b=gAvg(d.growth&&d.growth.self12,SELF_SKILLS.length); return a!=null&&b!=null ? b-a : null; }));
  const pulseD = avg(docs.map(d=>{ const a=gAvg(d.growth&&d.growth.pulse0,PULSE_Q.length), b=gAvg(d.growth&&d.growth.pulse12,PULSE_Q.length); return a!=null&&b!=null ? b-a : null; }));
  const sign = x => x==null ? "–" : (x>0?"+":"")+x;
  // focus areas: lowest-scoring practice skills across the cohort

  const focus = `<div class="learn">

    <div class="card"><h4>Scenario choices by module</h4>${scenRows.length?`<ul class="plain">${scenRows.map(x=>`<li><b>${x.m.short}</b> · ${Math.round(x.strong/x.total*100)}% strong choices <span class="note">(${x.total} choices)</span></li>`).join("")}</ul>`:`<p class="note">Appears once leaders work through scenarios.</p>`}</div>
  </div>`;
  const grid = `<div class="hm-wrap"><table class="hm"><thead><tr><th>Leader</th>${MODULES.map(m=>`<th title="${esc(m.short)}">${m.weeks.replace("Weeks ","Wk ").replace("Week ","Wk ")}</th>`).join("")}<th>Practice</th><th>Last active</th></tr></thead><tbody>
    ${docs.map(d=>`<tr class="${dashSel===d.id?"sel":""}"><th><button class="linkbtn" data-leader="${esc(d.id)}">${esc(leaderName(d))}</button><small>${esc(d.cohort||"No cohort")} · ${d.overall||0}%</small></th>${MODULES.map(m=>{ const x=(d.modules||[]).find(y=>y.id===m.id); const p=x?x.pct:0; return `<td><span class="cell c${p>=100?4:p>=60?3:p>=30?2:p>0?1:0}" title="${m.short}: ${p}%">${p}</span></td>`; }).join("")}<td>${dAvg(d)??"–"}</td><td>${ago(d.updatedAt)}</td></tr>`).join("")}
  </tbody></table></div>`;
  const sel = docs.find(d=>d.id===dashSel);
  return head + `<div class="tiles">
      <div class="tile"><span>Average completion</span><b>${comp??0}%</b><small>Across ${docs.length} leader${docs.length===1?"":"s"}</small></div>
      <div class="tile"><span>Average practice score</span><b>${prac??"–"}</b><small>Of 3, latest scored sessions</small></div>
      <div class="tile"><span>Growth, Week 0 to 12</span><b>${sign(selfD)} / ${sign(pulseD)}</b><small>Self-assessment / team pulse change</small></div>
    </div>
    <section class="blk"><h3>Focus for your next lab</h3>${focus}</section>
    <section class="blk"><h3>Leaders</h3><p class="lede">Module completion in percent. Select a leader to see their details.</p>${grid}</section>
    ${sel ? renderLeaderDetail(sel) : `<p class="note">Select a leader above to see their scenario answers, practice feedback, growth and anything they've shared.</p>`}`;
}
function renderLeaderDetail(d){
  const rateChip = r => r ? `<span class="rate ${RATING[r][1]}">${RATING[r][0]}</span>` : "";
  const scen = MODULES.filter(m=>d.scen&&d.scen[m.id]).map(m=>{ const s=d.scen[m.id];
    const t0 = s.s0!=null ? m.scenario.steps[0].options[s.s0].t : null, t1 = s.s1!=null ? m.scenario.steps[1].options[s.s1].t : null;
    return `<div class="card"><span class="eyebrow">${m.weeks} · ${m.short}</span>
      ${s.say?`<p><b>Wrote first:</b> “${esc(s.say)}”</p>`:`<p class="note">Didn't write a first response.</p>`}
      ${t0?`<p>${rateChip(s.r0)} ${t0}</p>`:""}${t1?`<p>${rateChip(s.r1)} ${t1}</p>`:""}</div>`; }).join("");
  const prac = ROLEPLAYS.filter(r=>d.rp&&d.rp[r.id]).map(r=>{ const x=d.rp[r.id], f=x.fb, tr=d.shared&&d.shared.rp&&d.shared.rp[r.id];
    return `<div class="card prac"><div class="fb-head"><div><span class="eyebrow">${esc(r.who)} · ${(x.history||[]).length} scored session${(x.history||[]).length===1?"":"s"}</span><h4>${r.title}</h4></div><div class="score"><b>${f?rpAvg(f):"–"}</b><span>latest of 3</span></div></div>
      ${(x.history||[]).length?`<p class="note">History: ${x.history.map(h=>h.avg+" ("+h.mode+", "+h.d+")").join(" → ")}</p>`:""}
      ${f?`<p><b>Coach summary:</b> ${esc(f.overall||"")}</p><div class="fb-rows">${(f.scores||[]).map(s=>`<div class="fb-row"><div class="dots">${[1,2,3].map(n=>`<i class="${n<=Number(s.score)?"on":""}"></i>`).join("")}</div><div><b>${esc(s.skill)}</b><p>${esc(s.evidence)}</p>${s.tip?`<p class="tip">${esc(s.tip)}</p>`:""}</div></div>`).join("")}</div>
      ${f.hidden?`<p><b>Uncovered the real issue?</b> ${esc(f.hidden)}</p>`:""}${f.next?`<p><b>Practice next:</b> ${esc(f.next)}</p>`:""}`:""}
      ${tr?`<details><summary>Shared conversation (${esc(tr.at)})</summary><div class="chat-log static">${(tr.turns||[]).map(t=>`<div class="msg ${t.role==="leader"?"me":"them"}"><span>${t.role==="leader"?"Leader":esc(r.who)}</span><p>${esc(t.text)}</p></div>`).join("")}</div></details>`:`<p class="note">Full conversation not shared.</p>`}</div>`; }).join("");
  const g = d.growth||{};
  const growthRows = (labels, a, b) => labels.map((l,i)=>`<div class="gr"><span>${l}</span><span>${(a&&a[i])||"–"}</span><span>${(b&&b[i])||"–"}</span><div>${barPair(Number(a&&a[i])||0, Number(b&&b[i])||0, 5)}</div></div>`).join("");
  const refl = Object.entries((d.shared&&d.shared.refl)||{}).map(([id,v])=>{ let q=id, mod=""; MODULES.forEach(m=>m.reflect.forEach(r=>{ if(r.id===id){ q=r.q; mod=m.short; } })); return `<div class="card"><span class="eyebrow">${esc(mod)} · shared ${esc(v.at)}</span><h4>${q}</h4><p>${esc(v.text)}</p></div>`; }).join("");
  return `<section class="blk detail" id="dash-detail">
    <div class="detail-head"><div><span class="eyebrow">${esc(d.cohort||"No cohort")} · last active ${ago(d.updatedAt)}</span><h3>${esc(leaderName(d))}</h3></div><div class="score"><b>${d.overall||0}%</b><span>complete</span></div></div>
    <p class="note">Currently on: ${esc(currentModule(d))}</p>
    <h4 class="dh">Scenario choices</h4>${scen?`<div class="learn">${scen}</div>`:`<p class="note">No scenarios worked yet.</p>`}
    <h4 class="dh">Practice studio</h4>${prac?`<div class="stack">${prac}</div>`:`<p class="note">No scored practice conversations yet.</p>`}
    <h4 class="dh">Growth</h4>
    <div class="gtable"><div class="gh"><span>Self-assessment</span><span>Week 0</span><span>Week 12</span><span></span></div>${growthRows(SELF_SKILLS, g.self0, g.self12)}</div>
    <div class="gtable" style="margin-top:12px"><div class="gh"><span>Team pulse</span><span>Week 0</span><span>Week 12</span><span></span></div>${growthRows(PULSE_Q, g.pulse0, g.pulse12)}<div class="gr"><span><b>Responses</b></span><span>${esc(g.n0||"–")}</span><span>${esc(g.n12||"–")}</span><div></div></div></div>
    <h4 class="dh">Shared reflections</h4>${refl?`<div class="stack">${refl}</div>`:`<p class="note">Nothing shared yet. Reflections stay private unless the leader shares them.</p>`}
  </section>`;
}
</script>
