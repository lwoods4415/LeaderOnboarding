<h2>Sign in</h2>
<p>Select the link below to sign in to your leadership program. It works once and expires after an hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Sign in</a></p>
<p>Or enter this code on the sign-in page: <strong>{{ .Token }}</strong></p>
<p>If you didn't ask for this email, you can ignore it.</p>
